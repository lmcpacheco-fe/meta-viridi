# IMX93 board validation suite using Cukinia statements only.
#
# Notes:
# - This suite maps the original test-imx93.sh checks to non-interactive tests.
# - Tests that relied on interactive pass/fail prompts are now strict pass/fail.
# - Tests that cannot be replicated exactly with Cukinia-only statements are marked.

logging suite "viridi-imx93"
logging class "sdc-tests"

cukinia_log "Starting Cukinia test suite for Viridi-imx93"

cukinia_log "Kernel log checks"
as "Kernel logs have no errors at priority err or higher" \
    cukinia_knoerror err

cukinia_log "DDR memory checks"
as "memtester binary is installed" \
    cukinia_cmd command -v memtester
as "DDR memory smoke test with memtester 50M x1" \
    cukinia_cmd memtester 50M 1

cukinia_log "eMMC checks"
as "eMMC block device /dev/mmcblk0 exists" \
    cukinia_test -b /dev/mmcblk0

# Original script printed lsblk details for manual review.
# Not replicated exactly with Cukinia-only statements.

cukinia_log "FlexSPI NOR checks"
# Original FlexSPI NOR test performed erase/write/read byte-level verification on /dev/mtd0.
# Not replicated with Cukinia-only statements because it requires multi-step stateful I/O flow.

cukinia_log "EEPROM checks"
as "I2C bus 2 exists" \
    cukinia_i2c 2
as "EEPROM responds at bus 2 address 0x54" \
    cukinia_i2c 2 0x54

# Original EEPROM test did write/readback data validation (0x11..0x88).
# Not replicated exactly with Cukinia-only statements.

cukinia_log "MMC/SDIO checks"
as "MMC host class exists" \
    cukinia_test -d /sys/class/mmc_host
as "At least one MMC host is present" \
    cukinia_cmd sh -c 'ls -d /sys/class/mmc_host/mmc[0-9]* >/dev/null 2>&1'

# Original script enumerated each host, printed manufacturer/serial/type,
# and classified as MMC/SD/SDIO. Not replicated exactly with Cukinia-only statements.

cukinia_log "I2C topology checks"
as "I2C bus 0 exists" \
    cukinia_i2c 0
as "I2C bus 1 exists" \
    cukinia_i2c 1
as "I2C bus 2 exists" \
    cukinia_i2c 2
as "I2C bus 4 exists" \
    cukinia_i2c 4

as "IO Expander responds at bus 0 address 0x44" \
    cukinia_i2c 0 0x44
as "RTC responds at bus 0 address 0x53" \
    cukinia_i2c 0 0x53
as "PCA9451 responds at bus 1 address 0x25" \
    cukinia_i2c 1 0x25
as "EEPROM responds at bus 2 address 0x54" \
    cukinia_i2c 2 0x54
as "IO Expander responds at bus 4 address 0x20" \
    cukinia_i2c 4 0x20
as "IO Expander responds at bus 4 address 0x21" \
    cukinia_i2c 4 0x21

cukinia_log "Ethernet checks"
as "eth0 interface is up" \
    cukinia_netif_is_up eth0
as "eth1 interface is up" \
    cukinia_netif_is_up eth1

as "eth0 has IPv4 address" \
    cukinia_netif_has_ip eth0 -4
as "eth1 has IPv4 address" \
    cukinia_netif_has_ip eth1 -4

as "DNS resolves www.google.com" \
    cukinia_dns_resolve www.google.com
as "Ping Google via eth0 succeeds" \
    cukinia_cmd ping -c 4 -I eth0 www.google.com
as "Ping Google via eth1 succeeds" \
    cukinia_cmd ping -c 4 -I eth1 www.google.com

# Original script configured static IPs when missing.
# Not replicated because Cukinia is validation-focused; this suite only asserts current state.

cukinia_log "Temperature checks"
as "Thermal class exists" \
    cukinia_test -d /sys/class/thermal
as "At least one thermal zone is present" \
    cukinia_cmd sh -c 'ls -d /sys/class/thermal/thermal_zone* >/dev/null 2>&1'
as "At least one readable thermal temp node exists" \
    cukinia_cmd sh -c 'find /sys/class/thermal -maxdepth 2 -name temp -type f | grep -q .'

# Original script printed all thermal sensor names and values.
# Not replicated exactly with Cukinia-only statements.

cukinia_log "IMX93 Cukinia suite complete"
